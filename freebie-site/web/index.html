<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-density="std">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>刷羊毛 · 像刷抖音一样刷零成本羊毛</title>
  <meta name="description" content="刷羊毛：全屏竖滑的零成本羊毛 feed。聚合全网餐饮/电商/银行/运营商/抖音/小红书/B站/AI算力/学生权益/会员福利，在线学习推荐算法越刷越懂你；已参加与过期自动归档进记录。只收零现金成本、估值≥10元、非长期签到的羊毛。">
  <meta name="theme-color" id="meta-theme" content="#f8f6f1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23c8371f'/%3E%3Crect x='8' y='8' width='48' height='48' rx='10' fill='none' stroke='%23fff6ee' stroke-opacity='.55' stroke-width='2'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' font-family='serif' font-weight='700' fill='%23fff6ee'%3E%E5%88%B7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>

  <header class="hud">
    <a class="logo" href="#" id="logo" aria-label="刷羊毛 · 回到推荐feed">
      <span class="seal" aria-hidden="true">刷</span>
      <span class="wordmark"><b>刷羊毛</b><small>SWIPE · WOOL</small></span>
    </a>
    <div class="hud-tabs" role="tablist" aria-label="feed 排序">
      <button class="htab active" type="button" data-mode="rec" role="tab" aria-selected="true">推荐</button>
      <button class="htab" type="button" data-mode="new" role="tab" aria-selected="false">最新</button>
      <button class="htab" type="button" data-mode="value" role="tab" aria-selected="false">高价值</button>
    </div>
    <span class="prog" id="prog" aria-label="feed 进度">– / –</span>
    <div class="hud-right">
      <button class="iconbtn" id="snd-btn" type="button" aria-label="关闭音效" title="音效开关">
        <svg id="snd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button class="iconbtn" id="theme-btn" type="button" aria-label="切换到夜间墨色主题" title="昼夜主题">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      </button>
      <button class="rec-pill" id="rec-btn" type="button" title="查看参加记录与无效记录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5a2.5 2.5 0 0 0 0 5H19"/><path d="M9 7h6M9 11h6"/></svg>
        <b id="rec-count">0</b><span>记录</span>
      </button>
    </div>
  </header>

  <!-- 永久可见的推荐调校 dock -->
  <aside class="dock" id="dock" aria-label="推荐调校台">
    <div class="dock-head"><b>调校推荐</b><small>实时生效</small></div>
    <div class="dock-scroll">
      <label class="dctl"><span>价值偏好</span><input type="range" id="w-value" min="0" max="2" step="0.1" value="1"><output id="o-value">1.0</output></label>
      <label class="dctl"><span>截止紧迫</span><input type="range" id="w-urgent" min="0" max="2" step="0.1" value="1"><output id="o-urgent">1.0</output></label>
      <label class="dctl"><span>新鲜度</span><input type="range" id="w-fresh" min="0" max="2" step="0.1" value="1"><output id="o-fresh">1.0</output></label>
      <label class="dctl"><span>探索率</span><input type="range" id="w-explore" min="0" max="0.4" step="0.02" value="0.12"><output id="o-explore">12%</output></label>
      <label class="dctl"><span>类目多样性</span><input type="range" id="w-diverse" min="0" max="1" step="0.1" value="0.6"><output id="o-diverse">0.6</output></label>
      <div class="dctl"><span>自动连刷</span>
        <span class="stepper"><button type="button" id="auto-minus" aria-label="减少连刷间隔">−</button><output id="auto-val">关</output><button type="button" id="auto-plus" aria-label="增加连刷间隔">＋</button></span>
      </div>
      <label class="dctl"><span>信息密度</span>
        <select id="density" aria-label="信息密度"><option value="imm">沉浸</option><option value="std" selected>标准</option><option value="compact">紧凑</option></select>
      </label>
      <label class="dctl switchline"><span>音效</span><span class="switch"><input type="checkbox" id="dock-sound" checked><span class="knob"></span></span></label>
      <label class="dctl switchline"><span>夜间墨色</span><span class="switch"><input type="checkbox" id="dock-theme"><span class="knob"></span></span></label>
      <div class="dock-btns">
        <button type="button" id="random-batch" title="换一批探索推荐">换一批</button>
        <button type="button" id="reset-profile" title="清空学习画像">重置画像</button>
        <button type="button" id="export-prefs" title="导出偏好与画像 JSON">导出</button>
      </div>
    </div>
  </aside>

  <main class="stage">
    <!-- 刷 feed -->
    <section class="view view-feed active" id="view-feed" aria-label="羊毛 feed">
      <div class="feed" id="feed" tabindex="0"></div>
      <div class="hint" id="hint" aria-hidden="true">
        <span class="hint-arrow">↑</span>
        <b>上滑刷下一条</b>
        <small>双击收藏 · 右侧按钮参加/无效/不感兴趣 · 停留越久越懂你</small>
      </div>
    </section>

    <!-- 分类浏览 -->
    <section class="view" id="view-cats" aria-label="分类浏览">
      <div class="panel">
        <div class="panel-head"><span class="sec-idx">分类</span><h2>全部羊毛</h2><span class="sub" id="cat-count"></span></div>
        <div class="toolbar">
          <div class="chiprow" id="cat-chips" role="group" aria-label="按平台筛选"></div>
          <div class="toolrow">
            <div class="searchbox">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="cat-search" placeholder="搜品牌 / 活动 / 奖品 / 标签…" aria-label="搜索活动">
            </div>
            <select class="sortsel" id="cat-sort" aria-label="排序方式">
              <option value="rec">排序：推荐分</option>
              <option value="value">排序：价值优先</option>
              <option value="deadline">排序：截止优先</option>
              <option value="conf">排序：可信度</option>
            </select>
            <span class="val-note">门槛：零成本 · 估值 ≥ ¥10 · 非长期签到</span>
          </div>
        </div>
        <div class="cat-grid" id="cat-grid"></div>
        <div class="empty" id="cat-empty" hidden>没有匹配的羊毛，换个筛选条件试试。</div>
      </div>
    </section>

    <!-- 记录 -->
    <section class="view" id="view-history" aria-label="参加记录">
      <div class="panel">
        <div class="panel-head"><span class="sec-idx">记录</span><h2>参加记录</h2><span class="sub" id="hist-count"></span></div>
        <div class="hist-bar">
          <div class="chiprow" id="hist-chips" role="group" aria-label="按记录状态筛选"></div>
          <span class="hist-tip">已参加 / 过期自动隐藏进这里 · 删除记录可回到 feed</span>
        </div>
        <div class="hist-list" id="hist-list"></div>
        <div class="empty" id="hist-empty" hidden>还没有记录 · 在 feed 右侧点「已参加」或「无效」，就会归档到这里。</div>
      </div>
    </section>

    <!-- 画像 / 推荐逻辑 -->
    <section class="view" id="view-profile" aria-label="推荐画像">
      <div class="panel">
        <div class="panel-head"><span class="sec-idx">画像</span><h2>推荐算法 · 越刷越懂你</h2><span class="sub">在线学习 · 本地保存</span></div>
        <div id="prof-body"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <button class="tab active" type="button" data-view="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="m7 8 5-5 5 5"/><path d="m7 16 5 5 5-5"/></svg><span>刷</span></button>
    <button class="tab" type="button" data-view="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>分类</span></button>
    <button class="tab" type="button" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5a2.5 2.5 0 0 0 0 5H19"/><path d="M9 7h6M9 11h6"/></svg><span>记录</span></button>
    <button class="tab" type="button" data-view="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M6 20v-6M11 20V8M16 20v-9M21 20V4"/></svg><span>画像</span></button>
  </nav>

  <!-- 攻略 / 推荐解释 抽屉 -->
  <div class="sheet-scrim" id="sheet-scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="攻略详情" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" id="sheet-close" type="button" aria-label="关闭">×</button>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
